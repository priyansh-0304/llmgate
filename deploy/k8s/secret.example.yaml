# TEMPLATE ONLY. Do not put real values here.
# `make secrets` (scripts/gen-secret.sh) writes deploy/k8s/secret.local.yaml with
# random values; that file is git-ignored. The gateway and Grafana read these as
# environment variables via secretKeyRef, so nothing secret is in an image,
# a ConfigMap, or the frontend bundle.
apiVersion: v1
kind: Secret
metadata:
  name: llmgate-secrets
  namespace: llmgate
type: Opaque
stringData:
  GATEWAY_API_KEY: "change-me"
  REDIS_PASSWORD: "change-me"
  GRAFANA_ADMIN_PASSWORD: "change-me"
