# kind cluster with host port mappings. Ports are bound to 127.0.0.1 only,
# so nothing is exposed to your Wi-Fi/LAN.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: llmgate
nodes:
  - role: control-plane
    extraPortMappings:
      - { containerPort: 30080, hostPort: 8080, listenAddress: "127.0.0.1", protocol: TCP } # gateway
      - { containerPort: 30300, hostPort: 3000, listenAddress: "127.0.0.1", protocol: TCP } # dashboard
      - { containerPort: 30030, hostPort: 3001, listenAddress: "127.0.0.1", protocol: TCP } # grafana
      - { containerPort: 30090, hostPort: 9090, listenAddress: "127.0.0.1", protocol: TCP } # prometheus
      - { containerPort: 30900, hostPort: 9000, listenAddress: "127.0.0.1", protocol: TCP } # mock upstream (load tests)
