# The React dashboard is static files served by nginx. nginx proxies /api/* to the
# gateway server-side, so the browser never holds any key and there is no CORS.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  labels: { app: dashboard }
spec:
  replicas: 1
  selector:
    matchLabels: { app: dashboard }
  template:
    metadata:
      labels: { app: dashboard }
    spec:
      containers:
        - name: dashboard
          image: llmgate/dashboard:dev
          imagePullPolicy: IfNotPresent
          env:
            - { name: GATEWAY_UPSTREAM, value: "http://gateway:8080" }
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet: { path: /, port: 80 }
          resources:
            requests: { cpu: 20m, memory: 16Mi }
            limits: { memory: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard
spec:
  type: NodePort
  selector: { app: dashboard }
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30300
