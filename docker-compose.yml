# Fastest way to run everything without Kubernetes:
#   make env && docker compose up --build              # gateway -> mock upstream
#   docker compose --profile ollama up --build         # also start Ollama (local CPU model)
# Secrets come from .env (generated by `make env`, git-ignored). Ports bind to 127.0.0.1 only.
name: llmgate

services:
  redis:
    image: redis:7-alpine
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --save '' --appendonly no --maxmemory 128mb --maxmemory-policy allkeys-lru"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?run `make env` first}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  mock-upstream:
    build: { context: ., dockerfile: deploy/Dockerfile.app, target: mock-upstream }
    environment:
      MOCK_LATENCY: 20ms
      MOCK_JITTER: 10ms
      MOCK_COMPLETION_TOKENS: "64"
    ports: ["127.0.0.1:9000:9000"]

  gateway:
    build: { context: ., dockerfile: deploy/Dockerfile.app, target: gateway }
    environment:
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?run `make env` first}
      GATEWAY_API_KEY: ${GATEWAY_API_KEY:?run `make env` first}
      DEFAULT_ROUTE: ${DEFAULT_ROUTE:-mock} # set DEFAULT_ROUTE=ollama when using the ollama profile
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:0.5b}
      MOCK_URL: http://mock-upstream:9000
      RATE_CAPACITY: ${RATE_CAPACITY:-20}
      RATE_REFILL_PER_SEC: ${RATE_REFILL_PER_SEC:-10}
      FALLBACK_ROUTE: ${FALLBACK_ROUTE:-}        # e.g. mock: used when the chosen route fails
      MAX_RETRIES: ${MAX_RETRIES:-1}
      BREAKER_FAILURES: ${BREAKER_FAILURES:-5}
      BREAKER_COOLDOWN: ${BREAKER_COOLDOWN:-30s}
      TOKEN_BUDGET: ${TOKEN_BUDGET:-0}           # tokens per key per window; 0 = off
      TOKEN_BUDGET_WINDOW: ${TOKEN_BUDGET_WINDOW:-24h}
      DEMO_ENDPOINT: ${DEMO_ENDPOINT:-true}      # dashboard "Send test request" button; local demos only
    depends_on:
      redis: { condition: service_healthy }
      mock-upstream: { condition: service_started }
    ports: ["127.0.0.1:8080:8080"]

  prometheus:
    image: prom/prometheus:v2.55.1
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=24h"]
    volumes:
      - ./deploy/k8s/files/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/k8s/files/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports: ["127.0.0.1:9090:9090"]
    depends_on: [gateway]

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?run `make env` first}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./deploy/k8s/files/grafana-datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
      - ./deploy/k8s/files/grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./deploy/k8s/files/llm-gateway-dashboard.json:/var/lib/grafana/dashboards/llm-gateway.json:ro
    ports: ["127.0.0.1:3001:3000"]
    depends_on: [prometheus]

  dashboard:
    build: { context: ., dockerfile: dashboard/Dockerfile }
    environment:
      GATEWAY_UPSTREAM: http://gateway:8080
    ports: ["127.0.0.1:3000:80"]
    depends_on: [gateway]

  # ---- optional: real local model on CPU ----
  ollama:
    profiles: ["ollama"]
    image: ollama/ollama:latest
    environment:
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_KEEP_ALIVE: 30m
    volumes: ["ollama-models:/root/.ollama"]
    ports: ["127.0.0.1:11434:11434"]

  ollama-pull:
    profiles: ["ollama"]
    image: ollama/ollama:latest
    depends_on: [ollama]
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["sh", "-c", "until ollama list >/dev/null 2>&1; do sleep 2; done; ollama pull ${OLLAMA_MODEL:-qwen2.5:0.5b}"]
    restart: "no"

volumes:
  ollama-models:
